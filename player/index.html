<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>StreamLive — Bienvenue</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#14161d;--text:#f7f8fb;--muted:#a4a9b5;--red:#e50945;--line:#2a2d36}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#38101d 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,440px);text-align:center}.logo{font-size:clamp(32px,8vw,44px);font-weight:950;letter-spacing:-1.8px;margin:0 0 12px}.logo span{color:var(--red)}.tag{color:var(--muted);margin:0 0 36px;font-size:15px}.actions{display:grid;gap:14px}.action{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;text-decoration:none;font-weight:800;font-size:16px;transition:transform .15s,background .15s}.action:active{transform:scale(.985)}.primary{background:var(--red);color:white}.secondary{border:1px solid #454853;background:var(--panel);color:var(--text)}.note{color:#777e8d;font-size:12px;margin-top:28px;line-height:1.6}
</style></head>
<body><main><h1 class="logo">Stream<span>Live</span></h1><p class="tag">La télévision en direct, simplement.</p><div class="actions"><a class="action primary" href="/inscription/">Créer un compte</a><a class="action secondary" href="/connexion/">Se connecter</a></div><p class="note">Connectez-vous ou créez votre compte pour continuer.</p></main></body></html>
