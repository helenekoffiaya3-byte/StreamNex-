<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamLive — Lecteur</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f0f15;color:#fff;font-family:system-ui,-apple-system,sans-serif}.player-container{max-width:900px;margin:24px auto;padding:12px;background:#050507;border-radius:12px;box-shadow:0 12px 40px #0008}.video-wrap{position:relative;background:#000;border-radius:8px;overflow:hidden}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.status{padding:8px 10px;font-size:14px;color:#bbb}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px}.controls button{border:1px solid #ffffff22;background:#ffffff10;color:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:not-allowed}.volume{width:100px}.progress{width:calc(100% - 20px);margin:0 10px;cursor:pointer}.time{font-variant-numeric:tabular-nums;color:#bbb}.error{color:#ff7777}.ready{color:#7dff9a}</style>
</head>
<body>
<main class="player-container">
<div class="video-wrap"><video id="video" playsinline preload="metadata"></video></div>
<input id="progress" class="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Progression">
<div id="status" class="status">Sélectionnez une chaîne StreamLive.</div>
<div class="controls">
<button id="play" type="button">▶ Lecture</button>
<button id="back" type="button" disabled>⏪ -60s</button>
<button id="forward" type="button" disabled>⏩ +60s</button>
<button id="mute" type="button">🔊</button>
<input id="volume" class="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume">
<span id="time" class="time">00:00 / 00:00</span>
<button id="fullscreen" type="button">⛶ Plein écran</button>
</div>
</main>
<script>
const video=document.getElementById('video'),progress=document.getElementById('progress'),play=document.getElementById('play'),back=document.getElementById('back'),forward=document.getElementById('forward'),mute=document.getElementById('mute'),volume=document.getElementById('volume'),time=document.getElementById('time'),status=document.getElementById('status'),fullscreen=document.getElementById('fullscreen');
let hls=null;
function fmt(v){if(!Number.isFinite(v)||v<0)return '00:00';v=Math.floor(v);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function setStatus(t,cls=''){status.textContent=t;status.className='status '+cls}
function seekable(){return video.seekable.length>0&&Number.isFinite(video.duration)}
function update(){const d=Number.isFinite(video.duration)?video.duration:0;progress.value=d?(video.currentTime/d)*100:0;time.textContent=fmt(video.currentTime)+' / '+(d?fmt(d):'LIVE');const ok=seekable();back.disabled=!ok;forward.disabled=!ok}
function cleanup(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}
async function loadStream(url){cleanup();if(!url){setStatus('Flux indisponible.','error');return}setStatus('Chargement du flux…');if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>setStatus('Flux prêt.','ready'));hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)setStatus('Erreur du flux HLS.','error')})}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('loadedmetadata',()=>setStatus('Flux prêt.','ready'),{once:true})}else setStatus('HLS non pris en charge par ce navigateur.','error')}
play.onclick=async()=>{if(video.paused){try{await video.play()}catch(e){setStatus('Lecture bloquée par le navigateur. Appuyez sur Lecture.','error')}}else video.pause()};
back.onclick=()=>{if(seekable())video.currentTime=Math.max(video.seekable.start(0),video.currentTime-60)};
forward.onclick=()=>{if(seekable())video.currentTime=Math.min(video.seekable.end(video.seekable.length-1),video.currentTime+60)};
mute.onclick=()=>{video.muted=!video.muted;mute.textContent=video.muted?'🔇':'🔊';volume.value=video.muted?0:video.volume};
volume.oninput=()=>{video.volume=Number(volume.value);video.muted=video.volume===0;mute.textContent=video.muted?'🔇':'🔊'};
progress.onclick=e=>{if(!seekable())return;const r=progress.getBoundingClientRect();const p=(e.clientX-r.left)/r.width;video.currentTime=video.seekable.start(0)+p*(video.seekable.end(video.seekable.length-1)-video.seekable.start(0))};
fullscreen.onclick=()=>{const el=document.querySelector('.video-wrap');if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};
video.addEventListener('play',()=>play.textContent='⏸ Pause');video.addEventListener('pause',()=>play.textContent='▶ Lecture');video.addEventListener('timeupdate',update);video.addEventListener('progress',update);video.addEventListener('loadedmetadata',update);video.addEventListener('emptied',update);
window.StreamLivePlayer={loadStream,cleanup};
const params=new URLSearchParams(location.search);loadStream(params.get('stream'));
</script>
</body>
</html>
