<!DOCTYPE html>
<html lang="fr-CI">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10134a">
<title>Créer un compte — StreamLive CI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171923;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff}.top{height:92px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:18px max(22px,calc((100vw - 760px)/2));}.brand{display:flex;align-items:center;gap:10px;background:#17194f;color:white;padding:10px 14px;font-size:clamp(20px,4vw,30px);font-weight:850;letter-spacing:-.8px}.symbol{color:#42e8b4;font-size:30px}.lock{font-size:23px;color:#777}main{max-width:760px;margin:28px auto;padding:0 22px 44px}h1{font-size:clamp(28px,5vw,36px);font-weight:900;font-style:italic;margin:0 0 14px;letter-spacing:-.8px}.intro{font-size:17px;line-height:1.55;color:#51535a;margin:0 0 4px}.signin{font-size:17px;line-height:1.5;color:#555;margin:0 0 28px}.signin a{display:block;color:#a22d53;font-weight:750;margin-top:2px}.country-label{display:block;border:1px solid #e5e5e5;border-radius:7px;padding:11px 16px 12px;color:#777;font-size:12px;margin:0 0 26px}.country-label select{display:block;width:100%;border:0;background:#fff;color:#252525;font-size:17px;padding:8px 0 0;outline:none}.offer{width:100%;display:flex;align-items:center;gap:22px;text-align:left;border:1px solid #e1e1e1;background:#fff;padding:26px 22px;min-height:160px;color:#171717;cursor:pointer}.offer:focus-visible,.offer:hover{border-color:#17194f;box-shadow:0 3px 16px #17194f12}.plus{width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;background:#171923;color:#fff;font-size:38px;font-weight:700}.offer-text{flex:1}.offer h2{font-size:23px;margin:0 0 8px}.offer p{font-size:16px;line-height:1.55;color:#777;margin:0}.arrow{font-size:32px;color:#171923}.back{display:block;width:100%;margin-top:28px;padding:16px;border:0;border-radius:5px;background:#eee;color:#171717;font-size:17px;font-weight:700;cursor:pointer}.note{color:#777;font-size:12px;line-height:1.5;margin-top:20px}@media(max-width:520px){.top{height:78px;padding:14px 20px}main{margin-top:25px;padding:0 20px 32px}.offer{gap:15px;padding:20px 14px;min-height:150px}.plus{width:48px;height:48px;flex-basis:48px}.offer h2{font-size:20px}.offer p{font-size:15px}}
</style></head>
<body><header class="top"><a class="brand" href="/" aria-label="StreamLive accueil"><span class="symbol">⌁</span><span>StreamNex</span></a><span class="lock" aria-label="Espace sécurisé">♙</span></header>
<main><h1>CRÉEZ UN COMPTE</h1><p class="intro">Sélectionnez votre abonnement ou votre offre pour accéder à vos contenus.</p><p class="signin">Vous avez déjà un compte StreamLive ?<a href="/connexion">Se connecter ›</a></p>
<label class="country-label">Pays d’abonnement<select id="country" aria-label="Pays d’abonnement"><option selected value="CI">Côte d’Ivoire</option><option value="GF">Guyane française</option></select></label>
<button class="offer" id="offer" type="button"><span class="plus">+</span><span class="offer-text"><h2 id="offer-title">Abonné StreamLive</h2><p id="offer-description">Vous avez déjà une offre StreamLive ou souhaitez choisir un abonnement pour accéder à vos chaînes et contenus.</p></span><span class="arrow">›</span></button>
<button class="back" type="button" onclick="history.length>1?history.back():location.assign('/')">Retour</button>
<p class="note">La création de compte et la gestion des abonnements doivent être activées sur le service avant de pouvoir finaliser l’inscription.</p></main>
<script>
const country=document.getElementById('country');country.addEventListener('change',()=>{document.documentElement.lang=country.value==='GF'?'fr-GF':'fr-CI';});
document.getElementById('offer').addEventListener('click',()=>{location.href='/inscription/abonne';});
</script></body></html>
