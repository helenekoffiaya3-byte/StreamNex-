<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="StreamLive — Espace utilisateur privé">
<title>Recherche — StreamLive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;min-height:100vh;padding:18px 16px 90px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search{flex:1;display:flex;align-items:center;background:#1b1b1b;border-radius:28px;padding:0 16px;height:52px}.search span{font-size:24px;color:#aaa}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:18px;padding:0 12px}
.profile{width:44px;height:44px;border-radius:50%;object-fit:cover}.title{font-size:28px;margin:8px 0 18px}.section-title{font-size:22px;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#151515;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid transparent}.card:hover,.card:focus{border-color:#555}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}.info{padding:9px 10px 11px}.name{font-weight:700}.meta{color:#aaa;font-size:12px;margin-top:3px}.badge{display:inline-block;margin-top:7px;font-size:11px;padding:3px 7px;border-radius:12px;background:#2b2b2b;color:#ddd}.badge.live{background:#b40000}.badge.off{background:#4b3020}.empty{padding:28px 10px;text-align:center;color:#aaa;background:#141414;border-radius:10px}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:6px}
@media(max-width:600px){.app{padding:12px 10px 84px}.title{font-size:24px}.grid{gap:8px}.search{height:48px}.search input{font-size:16px}.section-title{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<form class="search" id="search-form" role="search"><span>⌕</span><input id="program-search" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher un programme"><span aria-hidden="true">🎙</span></form>
<img class="profile" src="./assets/home-user.jpg" alt="Profil utilisateur">
</header>
<h1 class="title">Recherche</h1>
<section aria-live="polite">
<h2 class="section-title" id="result-title">Programmes disponibles</h2>
<div id="results" class="grid"></div>
</section>
<section id="similar-section" hidden aria-live="polite">
<h2 class="section-title">Programmes similaires</h2>
<div id="similar" class="grid"></div>
</section>
</main>
<script src="./user-search.js"></script>
</body>
</html>
