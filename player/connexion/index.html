<!DOCTYPE html>
<html lang="fr-CI"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10134a"><title>Se connecter — StreamLive CI</title>
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171923;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:88px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:18px max(22px,calc((100vw - 620px)/2))}.brand{display:flex;align-items:center;gap:10px;background:#17194f;color:#fff;padding:10px 14px;font-size:26px;font-weight:850}.symbol{color:#42e8b4;font-size:30px}main{max-width:620px;margin:34px auto;padding:0 22px}h1{font-size:32px;font-weight:900;font-style:italic}p{color:#555;line-height:1.55}.field{display:block;margin:20px 0;color:#555;font-size:14px}.field input{display:block;width:100%;padding:15px;margin-top:8px;border:1px solid #ddd;border-radius:6px;font-size:16px}.submit,.back{width:100%;padding:15px;border:0;border-radius:5px;font-size:16px;font-weight:750;cursor:pointer}.submit{background:#e0202b;color:#fff}.back{margin-top:12px;background:#eee;color:#171717}.links{margin-top:20px}.links a{color:#a22d53;font-weight:700;text-decoration:none}@media(max-width:520px){main{margin-top:24px}}</style></head>
<body><header class="top"><a class="brand" href="/" style="text-decoration:none"><span class="symbol">⌁</span>StreamNex</a></header><main><h1>SE CONNECTER</h1><p>Connectez-vous à votre compte StreamLive pour retrouver vos offres et vos contenus.</p><form id="login-form"><label class="field">Adresse e-mail<input type="email" name="email" autocomplete="email" required placeholder="vous@exemple.com"></label><label class="field">Mot de passe<input type="password" name="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label><button class="submit" type="submit">Se connecter</button></form><p id="message" role="status" aria-live="polite"></p><p class="links">Vous n’avez pas de compte ? <a href="/inscription">Créer un compte</a></p><button class="back" onclick="location.href='/'">Retour à l’accueil</button></main><script>document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='La connexion n’est pas encore activée : le service d’authentification doit être configuré.';});</script></body></html>
