<!DOCTYPE html>
<html lang="fr-CI"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10134a"><title>Se connecter — StreamLive CI</title>
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171923;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:88px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:18px max(22px,calc((100vw - 620px)/2))}.brand{display:flex;align-items:center;gap:10px;background:#17194f;color:#fff;padding:10px 14px;font-size:26px;font-weight:850}.symbol{color:#42e8b4;font-size:30px}main{max-width:620px;margin:34px auto;padding:0 22px}h1{font-size:32px;font-weight:900;font-style:italic}p{color:#555;line-height:1.55}.field{display:block;margin:20px 0;color:#555;font-size:14px}.field input{display:block;width:100%;padding:15px;margin-top:8px;border:1px solid #ddd;border-radius:6px;font-size:16px}.submit,.back{width:100%;padding:15px;border:0;border-radius:5px;font-size:16px;font-weight:750;cursor:pointer}.submit{background:#e0202b;color:#fff}.back{margin-top:12px;background:#eee;color:#171717}.links{margin-top:20px}.links a{color:#a22d53;font-weight:700;text-decoration:none}@media(max-width:520px){main{margin-top:24px}}</style></head>
<body><header class="top"><a class="brand" href="/" style="text-decoration:none"><span class="symbol">⌁</span>StreamNex</a></header><main><h1>SE CONNECTER</h1><p>Connectez-vous à votre compte StreamLive pour retrouver vos offres et vos contenus.</p><form id="login-form"><label class="field">Adresse e-mail<input type="email" name="email" autocomplete="email" required placeholder="vous@exemple.com"></label><label class="field">Mot de passe<input type="password" name="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label><button class="submit" type="submit">Se connecter</button></form><p id="message" role="status" aria-live="polite"></p><p class="links"><a href="#" id="forgot-password">Mot de passe oublié ?</a></p><p class="links">Vous n’avez pas de compte ? <a href="/inscription">Créer un compte</a></p><button class="back" onclick="location.href='/'">Retour à l’accueil</button></main><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
const form=document.getElementById('login-form');
const message=document.getElementById('message');
const submit=form.querySelector('button[type="submit"]');
function identityReady(){
  if(!window.netlifyIdentity || !window.netlifyIdentity.gotrue){
    message.textContent='Le service de connexion est indisponible. Vérifiez que Netlify Identity est activé dans les paramètres du site publié.';
    return false;
  }
  return true;
}
document.getElementById('forgot-password').addEventListener('click',async e=>{
  e.preventDefault();
  if(!identityReady()) return;
  const email=form.elements.email.value.trim();
  if(!email || !form.elements.email.checkValidity()){
    message.textContent='Saisissez votre adresse e-mail dans le champ ci-dessus, puis réessayez.';
    form.elements.email.focus();
    return;
  }
  const link=e.currentTarget;
  link.style.pointerEvents='none';
  try{
    await window.netlifyIdentity.gotrue.requestPasswordRecovery(email);
    message.textContent='Si un compte existe pour cette adresse, un e-mail de récupération va être envoyé. Vérifiez aussi vos courriers indésirables.';
  }catch(error){
    message.textContent='Impossible de lancer la récupération. Vérifiez que Netlify Identity est activé et réessayez.';
  }finally{link.style.pointerEvents='auto';}
});
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!form.reportValidity()) return;
  if(!identityReady()) return;
  const email=form.elements.email.value.trim();
  const password=form.elements.password.value;
  submit.disabled=true; submit.textContent='CONNEXION…'; message.textContent='Vérification de vos identifiants…';
  try{
    const user=await window.netlifyIdentity.gotrue.login(email,password,true);
    if(!user) throw new Error('LOGIN_FAILED');
    message.textContent='Connexion réussie. Ouverture de StreamLive…';
    window.netlifyIdentity.on('login',()=>{});
    window.location.assign('/');
  }catch(error){
    const raw=String(error && (error.msg||error.message)||'');
    if(/invalid|credentials|password|email/i.test(raw)) message.textContent='Adresse e-mail ou mot de passe incorrect.';
    else if(/confirm/i.test(raw)) message.textContent='Confirmez votre adresse e-mail avant de vous connecter.';
    else message.textContent='Connexion impossible. Vérifiez Netlify Identity et réessayez.';
  }finally{
    submit.disabled=false; submit.textContent='Se connecter';
  }
});
</script></body></html>
