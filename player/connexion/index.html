<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Connexion — StreamLive</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#14161d;--text:#f7f8fb;--muted:#a4a9b5;--red:#e50945;--line:#2a2d36}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#38101d 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);border:1px solid var(--line);border-radius:20px;background:rgba(20,22,29,.94);padding:28px}.back{color:var(--muted);text-decoration:none;font-size:14px}.logo{font-size:30px;font-weight:950;letter-spacing:-1px;margin:24px 0 6px}.logo span{color:var(--red)}h1{font-size:23px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;font-size:14px}.cta{width:100%;border:0;border-radius:11px;background:var(--red);color:white;font-weight:850;font-size:16px;padding:16px;margin-top:14px;cursor:pointer}.foot{text-align:center;margin:20px 0 0}.foot a{color:#ff5b83}.status{font-size:13px;color:#ffb6c7;min-height:20px}
</style></head><body><main class="card"><a class="back" href="/">← Retour</a><div class="logo">Stream<span>Live</span></div><h1>Se connecter</h1><p>Retrouvez votre espace StreamLive.</p><button class="cta" id="login">Se connecter</button><p class="status" id="status" aria-live="polite"></p><p class="foot">Pas encore de compte ? <a href="/inscription/">Créer un compte</a></p></main>
<script>
(function(){const status=document.getElementById('status');document.getElementById('login').addEventListener('click',function(){if(!window.netlifyIdentity){status.textContent='Le service de compte ne se charge pas. Vérifiez la configuration Netlify Identity.';return;}netlifyIdentity.open('login');});if(window.netlifyIdentity){netlifyIdentity.on('init',function(user){if(user)window.location.replace('/live.html');});netlifyIdentity.on('login',function(){window.location.replace('/live.html');});netlifyIdentity.on('error',function(err){status.textContent=(err&&err.message)||'Connexion impossible pour le moment.';});}})();
</script></body></html>
