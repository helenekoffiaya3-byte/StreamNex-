<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay — StreamLive</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:system-ui,sans-serif}.app{max-width:860px;margin:auto;padding:20px 18px 92px}.top{display:flex;align-items:center;gap:14px}.back{background:none;border:0;color:#fff;font-size:30px}.title{font-size:28px;font-style:italic}.channel{color:#999;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#202020;border-radius:7px;padding:8px}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#292929;border-radius:5px;display:grid;place-items:center;font-weight:800;color:#aaa}.name{font-weight:750;margin-top:8px}.meta{font-size:12px;color:#999;margin-top:3px}.empty{padding:30px 5px;color:#999;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#181818;display:flex;justify-content:center}.navin{width:min(860px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:#aaa;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}.nav a.active{color:#e52b5b}.ico{font-size:24px}@media(max-width:650px){.app{padding:16px 12px 88px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head>
<body><main class="app"><header class="top"><button class="back" onclick="history.back()" aria-label="Retour">‹</button><div><h1 class="title">REPLAY</h1><div id="channel" class="channel">Chargement…</div></div></header><section id="content"><div class="empty">Chargement des programmes…</div></section></main>
<nav class="nav"><div class="navin"><a href="./index.html"><span class="ico">⌂</span>Accueil</a><a href="./user-search.html"><span class="ico">⌕</span>Recherche</a><a href="./live.html"><span class="ico">▣</span>En direct</a><a class="active" href="./apps.html"><span class="ico">▦</span>Chaînes &amp; Apps</a><a href="./index.html"><span class="ico">•••</span>En plus</a></div></nav>
<script>
(async()=>{const q=new URLSearchParams(location.search),id=q.get('channel'),c=document.getElementById('content'),h=document.getElementById('channel');function e(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}try{const cr=await fetch('/api/channels',{cache:'no-store'});const channels=await cr.json();const ch=channels.find(x=>String(x.id)===String(id));h.textContent=ch?ch.name:'Chaîne';const r=await fetch('/api/programs?channel='+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw 0;const programs=await r.json();if(!Array.isArray(programs)||!programs.length){c.innerHTML='<div class="empty">Aucun programme en replay disponible pour cette chaîne actuellement.</div>';return}c.innerHTML='<div class="grid">'+programs.map(p=>'<article class="card"><div class="poster">'+e(p.title||p.name||'Replay')+'</div><div class="name">'+e(p.title||p.name||'Programme')+'</div><div class="meta">'+e(p.genre||'Replay')+'</div></article>').join('')+'</div>'}catch(_){c.innerHTML='<div class="empty">Impossible de charger les programmes en replay.</div>'}})();
</script></body></html>
