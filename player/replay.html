<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chaîne — Replay — StreamLive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080808;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.app{max-width:900px;margin:auto;padding:18px 16px 92px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border:0;border-radius:50%;background:#202020;color:#fff;font-size:31px;line-height:1;cursor:pointer}
.title{margin:0;font-size:25px;font-weight:900;font-style:italic}
.channel{margin-top:2px;color:#a9a9a9;font-size:14px}
.hero{position:relative;overflow:hidden;border-radius:18px;min-height:280px;background:linear-gradient(135deg,#1b0b28,#171717 55%,#2a0b42);margin-bottom:26px}
.hero.has-poster{background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.32) 55%,rgba(0,0,0,.05))}
.hero-content{position:relative;z-index:1;min-height:280px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end}
.eyebrow{font-size:13px;font-weight:800;color:#ddd;text-transform:uppercase;letter-spacing:.08em}
.hero h2{margin:7px 0 8px;font-size:31px;line-height:1.05}
.hero p{margin:0;color:#ddd;font-size:14px;max-width:580px}
.section-title{font-size:24px;margin:0 0 14px;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;border-radius:12px;background:#171717;overflow:hidden;cursor:pointer}
.poster{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#252525,#101010);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-size:17px;font-weight:850}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.name{padding:10px 12px 2px;font-size:16px;font-weight:800;line-height:1.15}
.meta{padding:4px 12px 13px;color:#969696;font-size:13px}
.empty{padding:30px 5px;color:#999;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#181818;z-index:10}
.navin{width:min(900px,100%);height:100%;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{color:#aaa;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.nav a.active{color:#e52b5b}.ico{font-size:24px;margin-bottom:2px}
@media(max-width:650px){.app{padding:14px 12px 88px}.title{font-size:22px}.hero,.hero-content{min-height:235px}.hero-content{padding:20px}.hero h2{font-size:26px}.section-title{font-size:22px}.grid{gap:10px}.name{font-size:14px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<button class="back" onclick="history.back()" aria-label="Retour">‹</button>
<div><h1 class="title">CHAÎNE &amp; APPS</h1><div id="channel" class="channel">Chargement…</div></div>
</header>
<section id="hero" class="hero">
<div class="hero-content"><div class="eyebrow">En ce moment sur la chaîne</div><h2 id="hero-title">Chargement…</h2><p id="hero-meta"></p></div>
</section>
<h2 class="section-title">Tous les contenus</h2>
<section id="content"><div class="empty">Chargement des programmes…</div></section>
</main>
<nav class="nav"><div class="navin">
<a href="./index.html"><span class="ico">⌂</span>Accueil</a>
<a href="./user-search.html"><span class="ico">⌕</span>Recherche</a>
<a href="./live.html"><span class="ico">▣</span>En direct</a>
<a class="active" href="./apps.html"><span class="ico">▦</span>Chaînes &amp; Apps</a>
<a href="./index.html"><span class="ico">•••</span>En plus</a>
</div></nav>
<script>
(async()=>{
 const q=new URLSearchParams(location.search),id=q.get('channel');
 const content=document.getElementById('content'),channelEl=document.getElementById('channel');
 const hero=document.getElementById('hero'),heroTitle=document.getElementById('hero-title'),heroMeta=document.getElementById('hero-meta');
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 try{
  const cr=await fetch('/api/channels',{cache:'no-store'});
  if(!cr.ok)throw 0;
  const channels=await cr.json(),ch=channels.find(x=>String(x.id)===String(id));
  channelEl.textContent=ch?ch.name:'Chaîne';
  const r=await fetch('/api/programs?channel='+encodeURIComponent(id),{cache:'no-store'});
  if(!r.ok)throw 0;
  const programs=await r.json();
  if(!Array.isArray(programs)||!programs.length){
   heroTitle.textContent='Aucun programme disponible';
   heroMeta.textContent='Les contenus Replay de cette chaîne seront affichés ici dès qu’ils sont disponibles.';
   content.innerHTML='<div class="empty">Aucun contenu en replay disponible pour cette chaîne actuellement.</div>';
   return;
  }
  const first=programs[0],firstName=first.name||first.title||'Programme';
  heroTitle.textContent=firstName;
  heroMeta.textContent=[first.genre||'Replay',first.provider||'StreamLive'].filter(Boolean).join(' · ');
  const poster=first.poster||first.posterUrl||'';
  if(poster){hero.classList.add('has-poster');hero.style.backgroundImage='url("'+String(poster).replace(/"/g,'&quot;')+'")'}
  content.innerHTML='<div class="grid">'+programs.map(p=>{
   const name=p.name||p.title||'Programme',meta=[p.genre||'Replay',p.provider||''].filter(Boolean).join(' · ');
   const src=p.poster||p.posterUrl||'';
   return '<article class="card">'+(src?'<div class="poster"><img loading="lazy" src="'+esc(src)+'" alt=""></div>':'<div class="poster">'+esc(name)+'</div>')+'<div class="name">'+esc(name)+'</div><div class="meta">'+esc(meta)+'</div></article>';
  }).join('')+'</div>';
 }catch(_){
  heroTitle.textContent='Contenus indisponibles';
  heroMeta.textContent='Impossible de charger les programmes de cette chaîne.';
  content.innerHTML='<div class="empty">Impossible de charger les programmes en replay.</div>';
 }
})();
</script>
</body>
</html>
