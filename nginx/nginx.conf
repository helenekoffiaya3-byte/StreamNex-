worker_processes auto;

events {
    worker_connections 2048;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            hls on;
            hls_path /var/www/live;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_nested on;
            hls_cleanup on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Edge controls. HLS is intentionally more permissive because Multi-Live
    # clients request multiple playlists/segments concurrently.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_zone $binary_remote_addr zone=api_perip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=hls_perip:10m rate=30r/s;

    client_max_body_size 10k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    server {
        listen 80;
        server_name _;

        # ACME webroot for future Let's Encrypt activation.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        # Never serve hidden files or common secret/database artifacts.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:env|sqlite|sqlite3|db|pem|key|crt|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # HLS delivery.
        location /live/ {
            alias /var/www/live/;
            limit_conn perip 20;
            limit_req zone=hls_perip burst=60 nodelay;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }
        }

        # API is rate-limited before it reaches Node.
        location ^~ /api/ {
            limit_conn perip 20;
            limit_req zone=api_perip burst=30 nodelay;

            proxy_pass http://streamlive-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Frontend and media download are same-origin through the reverse proxy.
        location / {
            limit_conn perip 20;
            limit_req zone=api_perip burst=30 nodelay;

            proxy_pass http://streamlive-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
