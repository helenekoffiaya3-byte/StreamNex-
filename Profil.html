<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMNEX - Profil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080a;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
.header{height:72px;background:#141417;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:16px;margin:6px}
.logo{height:46px}
.logo img{height:100%;object-fit:contain}
.settings{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#ccc}
.settings svg{width:32px;height:32px}
.center{min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.avatar{width:220px;height:220px;border-radius:50%;overflow:hidden;background:#1a1a1e;border:4px solid #1f1f23}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{margin-top:22px;font-size:42px;font-weight:800;letter-spacing:.5px}
.btn{margin-top:24px;background:#1a1d22;border:1px solid #2a2e35;color:#fff;padding:14px 36px;border-radius:14px;font-size:16px;font-weight:600;min-width:280px;text-align:center;cursor:pointer}
.btn:active{transform:scale(.98)}
@media(max-width:480px){.avatar{width:170px;height:170px}.name{font-size:32px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <!-- Mets ton fichier logo.png ici -->
    <img src="logo-streamnex-green.png" alt="STREAMNEX">
  </div>
  <div class="settings" title="Paramètres">
    <!-- Icône engrenage -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6V20a2 2 0 0 1-4 0v-.2a1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1H4a2 2 0 0 1 0-4h.2a1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6V4a2 2 0 0 1 4 0v.2a1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .6 1H20a2 2 0 0 1 0 4h-.2a1.65 1.65 0 0 0-.6 1z"></path>
    </svg>
  </div>
</div>

<div class="center">
  <div class="avatar">
    <img src="profile.jpg" alt="Photo de profil">
  </div>
  <div class="name" id="profile-name">Chargement…</div>
  <div class="btn">Gérer les profils</div>
</div>


<script type="module">
import { getUser, handleAuthCallback } from "https://esm.sh/@netlify/identity";
const name = document.getElementById("profile-name");
try {
  await handleAuthCallback();
  const user = await getUser();
  if (!user) window.location.replace("connexion.html");
  else name.textContent = user.user_metadata?.full_name || user.email?.split("@")[0] || "Utilisateur";
} catch (error) { name.textContent = "Profil indisponible"; console.error(error); }
</script>
<script src="/compte/lang-ui.js"></script>
<script src="/compte/theme-ui.js"></script>
</body>
</html>
