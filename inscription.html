<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte - STREAMNEX</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] min-h-screen flex items-center justify-center p-4">
<div class="bg-[#151515] border border-white/10 rounded-[24px] w-full max-w-[480px] p-8">
  <div class="flex justify-center mb-6"><img src="logo.png" alt="STREAMNEX" class="h-[110px] object-contain"></div>
  <h1 class="text-3xl font-black text-white text-center">Créer votre compte</h1>
  <p class="text-white/60 text-center mt-2">Rejoignez STREAMNEX gratuitement</p>
  <form id="signup-form" class="mt-8 space-y-4">
    <div><label for="full-name" class="text-sm text-white/80">Nom complet</label><input id="full-name" name="full_name" type="text" autocomplete="name" required maxlength="100" placeholder="Entrez votre nom complet" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <div><label for="email" class="text-sm text-white/80">Adresse email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="votre@email.com" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <div><label for="password" class="text-sm text-white/80">Mot de passe</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8 caractères minimum" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <div><label for="password-confirm" class="text-sm text-white/80">Confirmer le mot de passe</label><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Confirmez votre mot de passe" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <label class="flex items-center gap-2 text-sm text-white/80 pt-2"><input id="terms" type="checkbox" required class="accent-[#22C55E]"> J'accepte les conditions</label>
    <p id="form-message" role="status" aria-live="polite" class="text-sm text-center text-white/70"></p>
    <button id="signup-submit" type="submit" class="w-full text-center bg-[#22C55E] text-black font-black text-xl py-4 rounded-xl mt-4 hover:bg-[#16a34a]">Créer mon compte</button>
    <p class="text-center text-white/60 text-sm pt-2">Déjà un compte ? <a href="connexion.html" class="text-[#22C55E] underline font-bold">Se connecter</a></p>
  </form>
</div>
<script type="module">
import { signup, handleAuthCallback } from "https://esm.sh/@netlify/identity";
const message = document.getElementById("form-message");
const form = document.getElementById("signup-form");
const submit = document.getElementById("signup-submit");
try {
  const callback = await handleAuthCallback();
  if (callback?.user) window.location.replace("user.homepage.html");
} catch (error) {
  message.textContent = "Le lien de confirmation n'a pas pu être validé. Réessayez depuis votre email.";
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  const fullName = form.full_name.value.trim();
  const email = form.email.value.trim();
  const password = form.password.value;
  if (!fullName) { message.textContent = "Saisissez votre nom complet."; return; }
  if (password !== form.password_confirm.value) { message.textContent = "Les mots de passe ne correspondent pas."; return; }
  submit.disabled = true; submit.textContent = "Création du compte…"; message.textContent = "";
  try {
    await signup(email, password, { full_name: fullName });
    message.textContent = "Compte créé. Consultez votre boîte mail et confirmez votre adresse avant de vous connecter.";
    form.reset();
  } catch (error) {
    message.textContent = error?.message || "Impossible de créer le compte. Vérifiez les informations et réessayez.";
  } finally {
    submit.disabled = false; submit.textContent = "Créer mon compte";
  }
});
</script>
<script src="/compte/lang-ui.js"></script>
<script src="/compte/theme-ui.js"></script>
</body>
</html>
