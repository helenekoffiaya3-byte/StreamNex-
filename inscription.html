<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - STREAMNEX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] min-h-screen flex items-center justify-center p-4">

<div class="bg-[#151515] border border-white/10 rounded-[24px] w-full max-w-[480px] p-8">

  <!-- LOGO VRAI -->
  <div class="flex justify-center mb-6">
    <img src="logo.png" alt="STREAMNEX" class="h-[110px] object-contain">
  </div>

  <h1 class="text-3xl font-black text-white text-center">Créer votre compte</h1>
  <p class="text-white/60 text-center mt-2">Rejoignez STREAMNEX en 30 secondes</p>

  <div class="mt-8 space-y-4">
    <div>
      <label class="text-sm text-white/80">Nom complet</label>
      <input type="text" placeholder="Entrez votre nom complet" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
    </div>
    <div>
      <label class="text-sm text-white/80">Adresse email</label>
      <input type="email" placeholder="votre@email.com" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
    </div>
    <div>
      <label class="text-sm text-white/80">Mot de passe</label>
      <div class="relative">
        <input type="password" placeholder="••••••••••" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
        <span class="absolute right-4 top-4 text-white/40">👁️</span>
      </div>
    </div>
    <div>
      <label class="text-sm text-white/80">Confirmer mot de passe</label>
      <div class="relative">
        <input type="password" placeholder="••••••••••" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
        <span class="absolute right-4 top-4 text-white/40">👁️</span>
      </div>
    </div>

    <label class="flex items-center gap-2 text-sm text-white/80 pt-2">
      <input type="checkbox" checked class="accent-[#22C55E]"> J'accepte les conditions
    </label>

    <a href="abonnement.html" class="block text-center bg-[#22C55E] text-white font-black text-xl py-4 rounded-xl mt-4 hover:bg-[#16a34a]">Créer mon compte</a>

    <p class="text-center text-white/60 text-sm pt-2">Déjà un compte? <a href="connexion.html" class="text-[#22C55E] underline font-bold">Se connecter</a></p>
  </div>

</div>

</body>
</html>
