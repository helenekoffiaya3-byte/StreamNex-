<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sous-titres - STREAMNEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;display:flex;justify-content:center;color:white}
.container{width:100%;max-width:390px;min-height:100vh;background:#121212;padding:0 20px 30px}
.header{display:flex;align-items:center;gap:12px;background:#181818;padding:16px 0}
.back{font-size:28px;cursor:pointer;color:white;text-decoration:none}
.logo{font-weight:900;color:#2ECC71;font-size:22px}
.title{font-size:20px;font-weight:700;flex:1;text-align:center}
.section{color:#666;font-size:12px;letter-spacing:1px;margin:24px 0 12px;text-transform:uppercase}
.opt{background:#232323;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border:1.5px solid transparent;cursor:pointer}
.opt.selected{border-color:#2ECC71;background:#1e3322}
.opt-title{font-size:17px;font-weight:600}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center}
.radio.active{border-color:#2ECC71;background:#2ECC71}
.dot{width:12px;height:12px;background:black;border-radius:50%;display:none}
.radio.active .dot{display:block}
.size-row{background:#1e1e1e;border-radius:14px;padding:14px;display:flex;justify-content:space-around;gap:12px}
.size-item{display:flex;align-items:center;gap:8px;cursor:pointer}
.info{display:flex;gap:10px;color:#888;font-size:12px;margin-top:18px;background:#1a1a1a;padding:14px;border-radius:12px;border:1px solid #333}
.btn-green{width:100%;background:#2ECC71;color:black;font-weight:800;padding:18px;border-radius:16px;border:none;font-size:18px;cursor:pointer;margin-top:18px}
.status{min-height:18px;margin-top:12px;text-align:center;color:#2ECC71;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="header"><a class="back" href="parametres.html" aria-label="Retour aux paramètres">←</a><span class="logo">STREAMNEX</span><span class="title">Sous-titres</span></div>
  <div class="section">Langue des sous-titres</div>
  <div id="langs">
    <div class="opt" data-lang="off"><span class="opt-title">Désactivés</span><div class="radio"><div class="dot"></div></div></div>
    <div class="opt selected" data-lang="fr"><span class="opt-title">Français</span><div class="radio active"><div class="dot"></div></div></div>
    <div class="opt" data-lang="en"><span class="opt-title">English</span><div class="radio"><div class="dot"></div></div></div>
    <div class="opt" data-lang="es"><span class="opt-title">Español</span><div class="radio"><div class="dot"></div></div></div>
    <div class="opt" data-lang="ko"><span class="opt-title">Coréen / 한국어</span><div class="radio"><div class="dot"></div></div></div>
    <div class="opt" data-lang="ja"><span class="opt-title">Japonais / 日本語</span><div class="radio"><div class="dot"></div></div></div>
    <div class="opt" data-lang="orig"><span class="opt-title">Original</span><div class="radio"><div class="dot"></div></div></div>
  </div>
  <div class="section">Taille du texte</div>
  <div class="size-row" id="sizes">
    <div class="size-item" data-size="small"><div class="radio"><div class="dot"></div></div><span>Petit</span></div>
    <div class="size-item" data-size="medium"><div class="radio active"><div class="dot"></div></div><span>Moyen</span></div>
    <div class="size-item" data-size="large"><div class="radio"><div class="dot"></div></div><span>Grand</span></div>
  </div>
  <div class="info"><span style="color:#2ECC71">ⓘ</span><span><b style="color:#ccc">Vos sous-titres préférés seront affichés par défaut.</b><br>Cette application est 100% gratuite.</span></div>
  <button class="btn-green" id="save">Enregistrer</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<script>
let lang=localStorage.getItem('sub_lang')||'fr';
let size=localStorage.getItem('sub_size')||'medium';
function selectLang(value){
  lang=value;
  document.querySelectorAll('#langs .opt').forEach(o=>{
    const active=o.dataset.lang===value;
    o.classList.toggle('selected',active);
    o.querySelector('.radio').classList.toggle('active',active);
  });
}
function selectSize(value){
  size=value;
  document.querySelectorAll('.size-item').forEach(item=>{
    item.querySelector('.radio').classList.toggle('active',item.dataset.size===value);
  });
}
document.querySelectorAll('#langs .opt').forEach(o=>o.addEventListener('click',()=>selectLang(o.dataset.lang)));
document.querySelectorAll('.size-item').forEach(s=>s.addEventListener('click',()=>selectSize(s.dataset.size)));
selectLang(lang);
selectSize(size);
document.getElementById('save').addEventListener('click',()=>{
  localStorage.setItem('sub_lang',lang);
  localStorage.setItem('sub_size',size);
  document.getElementById('status').textContent='Préférences de sous-titres enregistrées.';
});
</script>
</body>
</html>
