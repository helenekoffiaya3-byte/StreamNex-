services:
  streamlive-app:
    build: .
    container_name: streamlive_app
    restart: unless-stopped
    user: "node"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.00"
