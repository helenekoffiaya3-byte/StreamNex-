services:
  nginx-hls:
    image: tiangolo/nginx-rtmp:latest
    container_name: streamlive_nginx
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/var/www/live
    networks:
      - streamlive_net

  streamlive-app:
    build: .
    container_name: streamlive_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      STREAM_BASE_URL: http://localhost:8080/live
      SESSION_TTL_MS: 1800000
    depends_on:
      - nginx-hls
    networks:
      - streamlive_net

  stream-generator:
    build: ./stream-generator
    container_name: streamlive_generator
    restart: unless-stopped
    depends_on:
      - nginx-hls
    networks:
      - streamlive_net

volumes:
  hls_data:

networks:
  streamlive_net:
    driver: bridge
