<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier le nom - STREAMNEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;display:flex;justify-content:center;color:white}
.container{width:100%;max-width:390px;min-height:100vh;background:#121212;padding:0 20px 30px}
.header{display:flex;align-items:center;gap:12px;background:#181818;padding:16px 0;border-radius:0 0 16px 16px}
.back{font-size:26px;cursor:pointer;color:#fff;text-decoration:none}
.logo{font-size:22px;font-weight:900;color:#2ECC71}
.title{font-size:18px;font-weight:700;margin-left:8px}
.icon-wrap{display:flex;justify-content:center;margin:25px 0}
.icon-circle{width:110px;height:110px;border:3px solid #2ECC71;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0f0f0f}
.label{color:#888;font-size:13px;margin:14px 0 8px;display:block}
.label.active{color:#2ECC71}
.input{width:100%;background:#2a2a2a;border:1.5px solid #2a2a2a;border-radius:14px;padding:16px;color:white;font-size:15px;outline:none}
.input.active{border-color:#2ECC71;background:#111}
.input.locked{color:#888}
.info{display:flex;gap:6px;color:#aaa;font-size:11px;margin:14px 0;line-height:1.5}
.btn-green{width:100%;background:#2ECC71;color:black;font-weight:700;padding:18px;border-radius:14px;border:none;font-size:16px;cursor:pointer;margin-top:18px}
.btn-green:disabled{background:#333;color:#666;cursor:not-allowed}
.cancel{display:block;text-align:center;margin-top:20px;color:#888;text-decoration:underline;cursor:pointer;font-size:14px}
.counter{font-size:11px;color:#666;float:right;margin-top:4px}
.message{min-height:20px;margin-top:12px;text-align:center;font-size:12px;line-height:1.5;color:#aaa}
.message.error{color:#ff7777}.message.success{color:#2ECC71}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a class="back" href="mon.compte.html%20" aria-label="Retour">←</a>
    <span class="logo">STREAMNEX</span>
    <span class="title">Modifier le nom</span>
  </div>
  <div class="icon-wrap"><div class="icon-circle" style="font-size:50px">👤</div></div>
  <label class="label">Nom actuel</label>
  <input class="input locked" id="currentName" type="text" readonly value="Chargement…">
  <label class="label active" for="newName">Nouveau nom d'utilisateur</label>
  <input class="input active" id="newName" type="text" placeholder="Entrez le nouveau nom" maxlength="20" autocomplete="nickname">
  <div class="counter"><span id="count">0</span>/20</div>
  <div class="info">ⓘ Le nom d'utilisateur doit avoir entre 3 et 20 caractères.</div>
  <p class="message" id="message" role="status" aria-live="polite"></p>
  <button class="btn-green" id="saveBtn" disabled>Enregistrer le nouveau nom</button>
  <a class="cancel" href="mon.compte.html%20">Annuler</a>
</div>
<script type="module">
import { getUser, updateUser, handleAuthCallback } from "https://esm.sh/@netlify/identity";
const currentName=document.getElementById("currentName");
const newName=document.getElementById("newName");
const saveBtn=document.getElementById("saveBtn");
const count=document.getElementById("count");
const message=document.getElementById("message");
let user=null;
let originalName="";
try{
  await handleAuthCallback();
  user=await getUser();
  if(!user){window.location.replace("connexion.html?redirect="+encodeURIComponent("modifier-nom.html"));throw new Error("Session absente");}
  originalName=user.user_metadata?.full_name||user.email?.split("@")[0]||"Utilisateur";
  currentName.value=originalName;
}catch(error){
  if(error.message!=="Session absente"){message.textContent="Impossible de charger votre compte. Reconnectez-vous puis réessayez.";message.className="message error";}
}
function validate(){
  const value=newName.value.trim();
  count.textContent=newName.value.length;
  saveBtn.disabled=!(value.length>=3&&value.length<=20&&value!==originalName);
}
newName.addEventListener("input",validate);
saveBtn.addEventListener("click",async()=>{
  const value=newName.value.trim();
  if(!user){message.textContent="Vous devez être connecté pour modifier votre nom.";message.className="message error";return;}
  if(value.length<3||value.length>20){message.textContent="Le nom doit contenir entre 3 et 20 caractères.";message.className="message error";return;}
  saveBtn.disabled=true;saveBtn.textContent="Enregistrement…";message.textContent="";message.className="message";
  try{
    const updatedUser=await updateUser({data:{full_name:value}});
    const savedName=updatedUser.user_metadata?.full_name||value;
    currentName.value=savedName;
    message.textContent="Votre nom a bien été mis à jour.";
    message.className="message success";
    setTimeout(()=>window.location.href="mon.compte.html%20",900);
  }catch(error){
    message.textContent=error?.message||"Impossible de modifier le nom. Réessayez.";
    message.className="message error";
    saveBtn.disabled=false;
  }finally{saveBtn.textContent="Enregistrer le nouveau nom";}
});
</script>
<script src="/compte/lang-ui.js"></script>
</body>
</html>
