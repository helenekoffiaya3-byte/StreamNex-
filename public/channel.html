<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamLive — Chaîne</title>
  <meta name="description" content="Programme TV réel fourni par la source EPG StreamLive.">
  <link rel="stylesheet" href="/public/assets/css/channel.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script>
</head>
<body>
  <div id="channel-view" class="view">
    <header class="hero" id="hero">
      <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="Retour">‹</button>
      <button class="icon-btn cast-btn" type="button" aria-label="Caster" disabled>⇱</button>
      <div class="hero-fade"></div>
      <img class="hero-logo" id="channelLogo" alt="">
    </header>

    <main class="rows" id="rows">
      <section class="state-block" id="channelState">Chargement des programmes réels…</section>
    </main>

    <button class="see-all-btn" id="openProgramsBtn" type="button">Films &amp; Séries — voir tout ›</button>

    <nav class="bottom-nav" aria-label="Navigation">
      <a class="nav-item" href="/"><span class="nav-icon">⌂</span>Accueil</a>
      <button class="nav-item" type="button" disabled><span class="nav-icon">⌕</span>Recherche</button>
      <a class="nav-item" href="/live"><span class="nav-icon">▭</span>En direct</a>
      <span class="nav-item active"><span class="nav-icon">▦</span>Chaînes &amp; Apps</span>
      <button class="nav-item" type="button" disabled><span class="nav-icon">•••</span>En plus</button>
    </nav>
  </div>

  <div id="program-view" class="view program-view hidden" aria-hidden="true">
    <header class="program-hero" id="programHero">
      <div class="hero-fade"></div>
      <button class="icon-btn close-btn" id="closeProgramBtn" type="button" aria-label="Fermer">✕</button>
    </header>
    <div class="program-body">
      <h1 class="program-title" id="programTitle"></h1>
      <p class="program-meta" id="programMeta"></p>
      <button class="play-btn" id="playBtn" type="button" disabled><span class="play-icon">▶</span><span id="playLabel">Lecture indisponible</span></button>
      <p class="program-desc" id="programDesc"></p>
      <p class="program-credits" id="programCredits"></p>

      <div class="tabs" id="programTabs">
        <button class="tab-btn active" type="button" data-tab="episodes">Épisodes</button>
        <button class="tab-btn" type="button" data-tab="more">À voir aussi</button>
      </div>
      <div class="tab-panel" id="tab-episodes">
        <div class="season-tabs" id="seasonTabs"></div>
        <p class="season-count" id="seasonCount"></p>
        <div class="episode-list" id="episodeList"></div>
      </div>
      <div class="tab-panel hidden" id="tab-more">
        <p class="empty-msg">Aucune recommandation fournie par la source EPG.</p>
      </div>
    </div>
  </div>

  <div id="programs-view" class="view programs-view hidden" aria-hidden="true">
    <header class="programs-header">
      <button class="icon-btn back-btn" id="closeProgramsBtn" type="button" aria-label="Retour">‹</button>
      <h1 class="programs-title">Films &amp; Séries</h1>
    </header>
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-btn active" type="button" data-filter="all">Tous</button>
      <button class="filter-btn" type="button" data-filter="film">Films</button>
      <button class="filter-btn" type="button" data-filter="serie">Séries</button>
      <button class="filter-btn" type="button" data-filter="novela">Novelas</button>
    </div>
    <div class="poster-grid" id="posterGrid"></div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script src="/public/assets/js/channel.js"></script>
</body>
</html>
