<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>BLEO TV - CHAÎNES &amp; APPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#08080c;color:white;padding-bottom:85px}
.header{padding:14px 16px;position:sticky;top:0;background:#08080c;z-index:20;border-bottom:1px solid #1a1a22}
.header b{font-size:13px;letter-spacing:1px;opacity:.7}
.section{padding:16px 12px 0}
.section h2{font-size:16px;font-weight:800;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#15151d;border:1px solid #222230;border-radius:10px;height:72px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;cursor:pointer;text-align:center;padding:4px;overflow-wrap:anywhere}
.tile img{max-width:70%;max-height:60%;object-fit:contain}
.tile:active{transform:scale(.96)}
.ivoiriennes .tile{height:56px}
.toutes .tile{height:58px;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#11111a;display:flex;justify-content:space-around;gap:2px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1e1e26;z-index:20}
.bottom a{flex:1;opacity:.55;color:white;text-decoration:none;font-size:10px;text-align:center;line-height:1.5}
.bottom a.active{opacity:1;color:#ff2a2a}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#player iframe{flex:1;width:100%;border:none;background:#08080c}
.player-bar{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.player-bar button{background:#222;color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:700}
#pTitle{font-size:14px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:101;padding:20px}
.modal-box{background:#15151d;border-radius:16px;padding:24px;text-align:center;width:100%;max-width:320px}
.modal-box p{opacity:.7}
.modal-box button{margin-top:18px;background:#2b7cff;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:800}
@media(min-width:600px){body{max-width:700px;margin:0 auto}.header{top:0}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(100%,700px)}}
</style>
</head>
<body>
<div class="header"><b>CHAÎNES &amp; APPS</b><span style="float:right" aria-hidden="true">📺</span></div>

<section class="section">
<h2>Les chaînes S+</h2>
<div class="grid" id="grid-splus"></div>
</section>

<section class="section ivoiriennes">
<h2>Les chaînes Ivoiriennes</h2>
<div class="grid" id="grid-ivoire"></div>
</section>

<section class="section toutes">
<h2>Toutes les chaînes</h2>
<div class="grid" id="grid-toutes"></div>
</section>

<nav class="bottom" aria-label="Navigation principale">
<a href="app.html">🏠<br>Accueil</a>
<a href="channels-apps.html#search">🔍<br>Recherche</a>
<a href="tv.html">📺<br>En direct</a>
<a class="active" href="chaines-apps.html" aria-current="page">⊞<br>Chaînes &amp; Apps</a>
<a href="plus.html">•••<br>En plus</a>
</nav>

<div id="player" role="dialog" aria-modal="true" aria-label="Lecteur de chaîne">
  <div class="player-bar">
    <button type="button" onclick="closePlayer()">✕ Fermer</button>
    <span id="pTitle"></span>
    <span aria-hidden="true"></span>
  </div>
  <iframe id="frame" title="Page officielle de la chaîne" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="unavailableTitle">
  <div class="modal-box">
    <div style="font-size:40px" aria-hidden="true">📺</div>
    <h3 id="unavailableTitle" style="margin:12px 0 6px">Indisponible pour le moment.</h3>
    <p id="unavailableText">Veuillez réessayer plus tard.</p>
    <button type="button" onclick="document.getElementById('modal').style.display='none'">Retour aux chaînes</button>
  </div>
</div>

<script>
const S_PLUS = [
  {name:"S+ PREMIERE",id:"s-plus-premiere",url:""},
  {name:"S+ IMAGES",id:"s-plus-images",url:""},
  {name:"S+ ACTION",id:"s-plus-action",url:""},
  {name:"S+ CINEMA",id:"s-plus-cinema",url:""},
  {name:"S+ FAMILY",id:"s-plus-family",url:""},
  {name:"S+ SPORT",id:"s-plus-sport",url:""},
  {name:"S+ DOCS",id:"s-plus-docs",url:""},
  {name:"S+ KIDS",id:"s-plus-kids",url:""},
  {name:"S+ COMEDY",id:"s-plus-comedy",url:""}
];
const IVOIRE = [
  {name:"RTI 1",url:"https://rtiplay.ci/rti1/direct"},
  {name:"RTI 2",url:"https://rtiplay.ci/rti2/direct"},
  {name:"A+ Ivoire",url:"https://aplusivoire.web-prod2.direct.canal-overseas.com/live"},
  {name:"Life TV",url:"https://lifetv.ci/"},
  {name:"7info",url:""}
];
const TOUTES = [
  "A4","NOVELAS","TV5MONDE","SUNU YEU F","ZACU TV","Maboke TV","RTL9","SCI","BET","Bravo","NOLLYWOOD TV","Cuisines","MANGAS","AB1","MANDEKA","PULAAGU","GUINEE 7","Serieclub","Nathan","History","Piwigo","Tivi5","Gulli","AUTOMOTO","Ludikids","TIJI","Trace","DRTV","Vox Congo","C Direct","Lux TV","MCRTV","HBO Max","Netflix","SuperSport","ESPN","Nat Geo","BBC News","Disney","Nick Jr.","TV5MONDE Info","LCI","TF1+","M6+"
];

const modal = document.getElementById('modal');
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const pTitle = document.getElementById('pTitle');
const unavailableTitle = document.getElementById('unavailableTitle');
const unavailableText = document.getElementById('unavailableText');

function makeGrid(id, list) {
  const grid = document.getElementById(id);
  const fragment = document.createDocumentFragment();
  list.forEach(item => {
    const name = typeof item === 'string' ? item : item.name;
    const url = typeof item === 'string' ? '' : item.url;
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.textContent = name;
    tile.setAttribute('aria-label', name + (url ? ', ouvrir la page connue' : ', indisponible'));
    tile.addEventListener('click', () => openCh(name, url));
    fragment.appendChild(tile);
  });
  grid.appendChild(fragment);
}

function openCh(name, url) {
  if (!url) {
    unavailableTitle.textContent = name + ' — Indisponible pour le moment.';
    unavailableText.textContent = 'Aucune page officielle n’est configurée pour cette chaîne. Veuillez réessayer plus tard.';
    modal.style.display = 'flex';
    return;
  }
  pTitle.textContent = name;
  frame.src = url;
  player.style.display = 'flex';
}
function closePlayer() {
  player.style.display = 'none';
  frame.removeAttribute('src');
}
modal.addEventListener('click', event => { if (event.target === modal) modal.style.display = 'none'; });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    modal.style.display = 'none';
    closePlayer();
  }
});
makeGrid('grid-splus', S_PLUS);
makeGrid('grid-ivoire', IVOIRE);
makeGrid('grid-toutes', TOUTES);
</script>
</body>
</html>
