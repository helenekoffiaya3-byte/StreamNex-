<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>BLEO TV - CHAÎNES &amp; APPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#08080c;color:white;padding-bottom:85px}
.header{padding:14px 16px;position:sticky;top:0;background:#08080c;z-index:20;border-bottom:1px solid #1a1a22}
.header b{font-size:13px;letter-spacing:1px;opacity:.7}
.section{padding:16px 12px 0}
.section h2{font-size:16px;font-weight:800;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#15151d;border:1px solid #222230;border-radius:10px;min-height:72px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;cursor:pointer;text-align:center;padding:7px 5px;overflow-wrap:anywhere;color:white;width:100%;line-height:1.25}
.tile:active{transform:scale(.96)}
.ivoiriennes .tile{min-height:56px}
.toutes .tile{min-height:58px;font-size:12px}
.tile:disabled{opacity:.7}
.empty,.load-status{padding:16px 8px;text-align:center;color:#a5a5b4;font-size:12px}
.load-status{min-height:42px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#11111a;display:flex;justify-content:space-around;gap:2px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1e1e26;z-index:20}
.bottom a{flex:1;opacity:.55;color:white;text-decoration:none;font-size:10px;text-align:center;line-height:1.5}
.bottom a.active{opacity:1;color:#ff2a2a}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#player iframe{flex:1;width:100%;border:none;background:#08080c}
.player-bar{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.player-bar button{background:#222;color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:700}
#pTitle{font-size:14px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:101;padding:20px}
.modal-box{background:#15151d;border-radius:16px;padding:24px;text-align:center;width:100%;max-width:320px}
.modal-box p{opacity:.7}
.modal-box button{margin-top:18px;background:#2b7cff;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:800}
@media(min-width:600px){body{max-width:700px;margin:0 auto}.header{top:0}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(100%,700px)}}
</style>
</head>
<body>
<div class="header"><b>CHAÎNES &amp; APPS</b><span style="float:right" aria-hidden="true">📺</span></div>

<section class="section">
<h2>Les chaînes S+</h2>
<div class="grid" id="grid-splus"></div>
</section>

<section class="section ivoiriennes">
<h2>Les chaînes Ivoiriennes</h2>
<div class="grid" id="grid-ivoire"></div>
</section>

<section class="section toutes">
<h2>Toutes les chaînes</h2>
<div class="grid" id="grid-toutes"></div>
<div id="load-sentinel" class="load-status" aria-live="polite">Chargement du catalogue…</div>
</section>

<nav class="bottom" aria-label="Navigation principale">
<a href="app.html">🏠<br>Accueil</a>
<a href="channels-apps.html#search">🔍<br>Recherche</a>
<a href="tv.html">📺<br>En direct</a>
<a class="active" href="chaines-apps.html" aria-current="page">⊞<br>Chaînes &amp; Apps</a>
<a href="plus.html">•••<br>En plus</a>
</nav>

<div id="player" role="dialog" aria-modal="true" aria-label="Lecteur de chaîne">
  <div class="player-bar">
    <button type="button" id="close-player">✕ Fermer</button>
    <span id="pTitle"></span><span aria-hidden="true"></span>
  </div>
  <iframe id="frame" title="Page officielle de la chaîne" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="unavailableTitle">
  <div class="modal-box">
    <div style="font-size:40px" aria-hidden="true">📺</div>
    <h3 id="unavailableTitle" style="margin:12px 0 6px">Indisponible pour le moment.</h3>
    <p id="unavailableText">Veuillez réessayer plus tard.</p>
    <button type="button" id="modal-close">Retour aux chaînes</button>
  </div>
</div>

<script src="config/channels.js"></script>
<script>
(function () {
  'use strict';
  const catalogue = Array.isArray(window.STREAMLIVE_CHANNELS) ? window.STREAMLIVE_CHANNELS.slice() : [];
  const gridSplus = document.getElementById('grid-splus');
  const gridIvoire = document.getElementById('grid-ivoire');
  const gridToutes = document.getElementById('grid-toutes');
  const sentinel = document.getElementById('load-sentinel');
  const modal = document.getElementById('modal');
  const player = document.getElementById('player');
  const frame = document.getElementById('frame');
  const pTitle = document.getElementById('pTitle');
  const unavailableTitle = document.getElementById('unavailableTitle');
  const unavailableText = document.getElementById('unavailableText');
  const BATCH_SIZE = 36;
  let allChannels = [];
  let renderedCount = 0;
  let observer = null;

  function openChannel(channel) {
    if (!channel.webUrl) {
      unavailableTitle.textContent = (channel.name || 'Chaîne') + ' — Indisponible pour le moment.';
      unavailableText.textContent = 'Aucune page officielle n’est configurée pour cette chaîne. Veuillez réessayer plus tard.';
      modal.style.display = 'flex';
      return;
    }
    pTitle.textContent = channel.name || 'Chaîne';
    frame.src = channel.webUrl;
    player.style.display = 'flex';
  }

  function closePlayer() {
    player.style.display = 'none';
    frame.removeAttribute('src');
  }

  function createTile(channel) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    const number = Number.isInteger(channel.channelNumber) ? channel.channelNumber + '. ' : '';
    tile.textContent = number + (channel.name || 'Chaîne sans nom');
    tile.setAttribute('aria-label', (channel.name || 'Chaîne') + (channel.webUrl ? ', ouvrir la page officielle connue' : ', indisponible'));
    tile.addEventListener('click', () => openChannel(channel));
    return tile;
  }

  function fillFeaturedGrid(grid, channels, emptyMessage) {
    grid.replaceChildren();
    if (!channels.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = emptyMessage;
      grid.appendChild(empty);
      return;
    }
    const fragment = document.createDocumentFragment();
    channels.forEach(channel => fragment.appendChild(createTile(channel)));
    grid.appendChild(fragment);
  }

  function loadNextBatch() {
    if (renderedCount >= allChannels.length) {
      sentinel.textContent = allChannels.length ? 'Toutes les chaînes du catalogue sont affichées.' : 'Aucune chaîne à afficher.';
      if (observer) observer.disconnect();
      return;
    }
    const next = allChannels.slice(renderedCount, renderedCount + BATCH_SIZE);
    const fragment = document.createDocumentFragment();
    next.forEach(channel => fragment.appendChild(createTile(channel)));
    gridToutes.appendChild(fragment);
    renderedCount += next.length;
    sentinel.textContent = ' ' + renderedCount + ' / ' + allChannels.length + ' chaînes chargées';
    if (renderedCount >= allChannels.length) {
      sentinel.textContent = 'Toutes les chaînes du catalogue sont affichées.';
      if (observer) observer.disconnect();
    }
  }

  document.getElementById('close-player').addEventListener('click', closePlayer);
  document.getElementById('modal-close').addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', event => { if (event.target === modal) modal.style.display = 'none'; });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      modal.style.display = 'none';
      closePlayer();
    }
  });

  if (!catalogue.length) {
    fillFeaturedGrid(gridSplus, [], 'Le catalogue n’a pas pu être chargé.');
    fillFeaturedGrid(gridIvoire, [], 'Le catalogue n’a pas pu être chargé.');
    sentinel.textContent = 'Catalogue indisponible : vérifie le fichier config/channels.js.';
    return;
  }

  const sorted = catalogue.slice().sort((a, b) => (a.channelNumber || 0) - (b.channelNumber || 0));
  const splus = sorted.filter(channel => channel.group === 'S+' || /^S\+/i.test(channel.name || ''));
  const ivoire = sorted.filter(channel => /Côte d’Ivoire/i.test(channel.group || ''));

  fillFeaturedGrid(gridSplus, splus, 'Aucune chaîne S+ n’est enregistrée dans le catalogue.');
  fillFeaturedGrid(gridIvoire, ivoire, 'Aucune chaîne ivoirienne n’est enregistrée dans le catalogue.');

  allChannels = sorted;
  sentinel.textContent = '';
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver(entries => {
      if (entries.some(entry => entry.isIntersecting)) loadNextBatch();
    }, {rootMargin: '500px 0px'});
    observer.observe(sentinel);
  } else {
    window.addEventListener('scroll', () => {
      if (sentinel.getBoundingClientRect().top < window.innerHeight + 500) loadNextBatch();
    }, {passive:true});
  }
  loadNextBatch();
})();
</script>
</body>
</html>
