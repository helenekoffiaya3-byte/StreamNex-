<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMNEX - Accueil</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;
    color:#fff;
    font-family: Inter, Arial, sans-serif;
    padding: 30px 20px 112px;
  }
  .header{
    text-align:center;
    margin-bottom: 40px;
  }
  .logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom: 25px;
  }
  .header{position:relative}
  .settings-link{position:absolute;right:4px;top:8px;width:46px;height:46px;display:grid;place-items:center;color:#aaa;text-decoration:none;border:1px solid #333;border-radius:50%;background:#151515}
  .settings-link svg{width:25px;height:25px}
  .bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(5,5,5,.97);border-top:1px solid #292929;backdrop-filter:blur(14px)}
  .nav-item{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 2px;color:#ddd;text-decoration:none;font-size:12px;font-weight:600;text-align:center;border-radius:10px}
  .nav-item svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav-item.active{color:#20c968}
  .nav-item.active svg{stroke-width:2.5}
  .nav-item span{white-space:nowrap}
  @media(max-width:420px){.nav-item{font-size:10px}.nav-item svg{width:24px;height:24px}.logo h1{font-size:38px}}
  .logo h1{
    color:#2ECC71;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .logo .splash{
    width:90px;
    height:70px;
    background:#2ECC71;
    clip-path: polygon(10% 0, 100% 10%, 90% 100%, 0 90%);
    border-radius: 20px;
    position:relative;
  }
  .welcome h2{
    font-size: 28px;
    font-weight:700;
  }
  .welcome p{
    color:#aaa;
    margin-top:8px;
    font-size:15px;
  }
  .section-title{
    font-size:22px;
    font-weight:700;
    margin: 20px 0;
    border-bottom:2px solid #333;
    padding-bottom:8px;
    width:fit-content;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap:20px;
  }
  .card{
    background:#1a1a1a;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition: transform .2s, box-shadow .2s;
    border:1px solid #222;
  }
  .card:hover{
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(46,204,113,0.3);
    border-color:#2ECC71;
  }
  .card img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
  }
  .card-info{
    padding:14px;
    text-align:center;
  }
  .card-info h3{
    font-size:18px;
  }
</style>
</head>
<body>

<div class="header">
  <a class="settings-link" href="compte/parametres.html" aria-label="Paramètres et profil" title="Paramètres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.78.45l-.06.06h-3.4l-.02-.08a1.7 1.7 0 0 0-1.3-1.3l-.08-.02-2.94-1.7.02-.08a1.7 1.7 0 0 0-.45-1.78l-.06-.06v-3.4l.08-.02a1.7 1.7 0 0 0 1.3-1.3l.02-.08 2.94-1.7.08.02a1.7 1.7 0 0 0 1.78-.45l.06-.06h3.4l.02.08a1.7 1.7 0 0 0 1.3 1.3l.08.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 15Z" transform="translate(-1 -1) scale(1.08)"></path></svg>
  </a>
  <div class="logo">
    <div class="splash"></div>
    <h1>STREAMNEX</h1>
  </div>
  <div class="welcome">
    <h2>Bienvenue <span id="user-name">…</span></h2>
    <p>Votre compte a été créé avec succès</p>
  </div>
</div>

<h3 class="section-title">Recommandés pour vous</h3>

<div class="grid">
  <div class="card" onclick="play('lolirock')">
    <img src="images/lolirock.jpg" alt="LoliRock">
    <div class="card-info"><h3>LoliRock</h3></div>
  </div>

  <div class="card" onclick="play('ghost-force')">
    <img src="images/ghost-force.jpg" alt="Ghost Force">
    <div class="card-info"><h3>Ghost Force</h3></div>
  </div>

  <div class="card" onclick="play('miraculous')">
    <img src="images/miraculous.jpg" alt="Miraculous">
    <div class="card-info"><h3>Miraculous</h3></div>
  </div>

  <div class="card" onclick="play('jumanji')">
    <img src="images/jumanji.jpg" alt="Jumanji">
    <div class="card-info"><h3>Jumanji</h3></div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Navigation principale">
  <a class="nav-item active" href="user.homepage.html" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span>Accueil</span>
  </a>
  <a class="nav-item" href="#recherche" data-coming-soon>
    <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"></circle><path d="m16.2 16.2 5 5"></path></svg><span>Recherche</span>
  </a>
  <a class="nav-item" href="#favoris" data-coming-soon>
    <svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"></path></svg><span>Favoris</span>
  </a>
  <a class="nav-item" href="#telechargements" data-coming-soon>
    <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"></path><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg><span>Téléchargements</span>
  </a>
  <a class="nav-item" href="Profil.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Profil</span>
  </a>
</nav>

<div id="nav-notice" role="status" aria-live="polite" style="display:none;position:fixed;z-index:30;bottom:94px;left:50%;transform:translateX(-50%);background:#202020;border:1px solid #3a3a3a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;white-space:nowrap">Cette rubrique sera bientôt disponible.</div>

<script>
document.querySelectorAll('[data-coming-soon]').forEach(item => item.addEventListener('click', event => {
  event.preventDefault();
  const notice = document.getElementById('nav-notice');
  notice.style.display = 'block';
  window.clearTimeout(window.streamNexNavNotice);
  window.streamNexNavNotice = window.setTimeout(() => notice.style.display = 'none', 2200);
}));
function play(id){
  window.location.href = `/watch.html?film=${id}`;
}
</script>


<script type="module">
import { getUser, handleAuthCallback } from "https://esm.sh/@netlify/identity";
try {
  await handleAuthCallback();
  const user = await getUser();
  if (!user) window.location.replace("connexion.html");
  else document.getElementById("user-name").textContent = user.user_metadata?.full_name || user.email?.split("@")[0] || "Utilisateur";
} catch (error) { console.error("Netlify Identity:", error); window.location.replace("connexion.html"); }
</script>
<script src="/compte/lang-ui.js"></script>
<script src="/compte/theme-ui.js"></script>
</body>
</html>
