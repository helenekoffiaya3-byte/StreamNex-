name: StreamLive core validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate catalogue
        run: npm run check:channels
      - name: Start core
        run: |
          PORT=4317 node server.js >/tmp/streamlive.log 2>&1 &
          echo $! >/tmp/streamlive.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/api/stream/channels >/tmp/channels.json && break; sleep 1; done
          test -s /tmp/channels.json || { cat /tmp/streamlive.log; exit 1; }
      - name: Validate core APIs
        run: |
          set -eux
          grep -q '"count":184' /tmp/channels.json
          node -e "const d=require('/tmp/channels.json'); const wanted=['s-plus-prime','s-plus-cine','s-plus-kids']; if(!wanted.every(id=>d.channels.some(c=>c.id===id&&c.group==='S+ StreamLive'))) process.exit(1); console.log('S+ StreamLive channels OK')"
          curl -fsS http://127.0.0.1:4317/api/health >/tmp/health.json
          grep -q '"database":false' /tmp/health.json
          curl -fsS http://127.0.0.1:4317/api/catalogue >/tmp/catalogue.json
          grep -q '"multi-live"' /tmp/catalogue.json
          curl -fsS http://127.0.0.1:4317/api/channels/rti-1/source >/tmp/source.json
          curl -fsS http://127.0.0.1:4317/api/live/channels >/tmp/live.json
          grep -q '"count":184' /tmp/live.json
          curl -fsS http://127.0.0.1:4317/api/channels/rti-1/programs >/tmp/programs.json
          grep -q '"programCount":14' /tmp/programs.json
          node -e "const d=require('/tmp/programs.json'); if(!d.success||d.count===0&&d.programCount!==14||!Array.isArray(d.occurrences)) process.exit(1); console.log('programme contract OK')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/channels/does-not-exist)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/data/streamlive.sqlite)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/download/media?id=test)" = "404"
          curl -fsS http://127.0.0.1:4317/live >/tmp/live.html
          grep -q "LIVE" /tmp/live.html
      - name: Server log on failure
        if: failure()
        run: cat /tmp/streamlive.log
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlive-core-log
          path: /tmp/streamlive.log
          if-no-files-found: ignore
      - name: Stop core
        if: always()
        run: test ! -f /tmp/streamlive.pid || kill "$(cat /tmp/streamlive.pid)" || true
