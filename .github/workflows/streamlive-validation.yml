name: StreamLive core validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate catalogue
        run: npm run check:channels
      - name: Syntax checks
        run: |
          node --check server.js
          node --check scripts/streamlive-hls.js
          node --check scripts/audit-editorial.js
          node --check scripts/audit-logos.js
      - name: Validate editorial schedule
        run: npm run check:editorial
      - name: Start core
        run: |
          PORT=4317 node server.js >/tmp/streamlive.log 2>&1 &
          echo $! >/tmp/streamlive.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/api/stream/channels >/tmp/channels.json && break; sleep 1; done
          test -s /tmp/channels.json || { cat /tmp/streamlive.log; exit 1; }
      - name: Validate core APIs
        run: |
          set -eux
          grep -q '"count":232' /tmp/channels.json
          node -e "const d=require('/tmp/channels.json'); const wanted=['s-plus-avant-premiere','s-plus-premiere','s-plus-docs','s-plus-prime','s-plus-cine','s-plus-kids','s-plus-fiction','s-plus-channel','s-plus-music','s-plus-tv','s-plus-family','s-plus-sport-1','s-plus-sport-2','s-plus-sport-3','s-plus-sport-4','s-plus-sport-5','s-plus-sport-6','s-plus-movies','s-plus-infosport','s-plus-infos','s-plus-media','s-plus-lloliwood','s-plus-bl']; const found=d.channels.filter(c=>wanted.includes(c.id)); if(d.count!==211||found.length!==wanted.length||!found.every(c=>c.group==='S+ StreamLive')) process.exit(1); const nums=d.channels.map(c=>c.number); const ids=d.channels.map(c=>c.id); if(new Set(nums).size!==nums.length||new Set(ids).size!==ids.length) process.exit(1); const ll=found.find(c=>c.id==='s-plus-lloliwood'); const bl=found.find(c=>c.id==='s-plus-bl'); if(!ll||ll.name!=='S+ LLOLIWOOD'||!bl||bl.name!=='S+ BL') process.exit(1); console.log('S+ StreamLive catalogue OK:',found.length,'channels')"
          for id in s-plus-avant-premiere s-plus-premiere s-plus-docs s-plus-prime s-plus-cine s-plus-kids s-plus-fiction s-plus-channel s-plus-music s-plus-tv s-plus-family s-plus-sport-1 s-plus-sport-2 s-plus-sport-3 s-plus-sport-4 s-plus-sport-5 s-plus-sport-6 s-plus-movies s-plus-infosport s-plus-infos s-plus-media s-plus-lloliwood s-plus-bl; do curl -fsS "http://127.0.0.1:4317/api/channels/$id/source" >/dev/null; done
          curl -fsS http://127.0.0.1:4317/api/editorial/streamlive/current >/tmp/editorial.json
          grep -q '"success":true' /tmp/editorial.json
          curl -fsS http://127.0.0.1:4317/api/health >/tmp/health.json
          grep -q '"database":false' /tmp/health.json
          curl -fsS http://127.0.0.1:4317/api/catalogue >/tmp/catalogue.json
          grep -q '"multi-live"' /tmp/catalogue.json
          curl -fsS http://127.0.0.1:4317/api/channels/rti-1/source >/tmp/source.json
          curl -fsS http://127.0.0.1:4317/api/live/channels >/tmp/live.json
          grep -q '"count":232' /tmp/live.json
          curl -fsS http://127.0.0.1:4317/api/channels/rti-1/programs >/tmp/programs.json
          grep -q '"programCount":14' /tmp/programs.json
          node -e "const d=require('/tmp/programs.json'); if(!d.success||d.count===0&&d.programCount!==14||!Array.isArray(d.occurrences)) process.exit(1); console.log('programme contract OK')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/channels/does-not-exist)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/data/streamlive.sqlite)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/download/media?id=test)" = "404"
          curl -fsS http://127.0.0.1:4317/live >/tmp/live.html
          grep -q "LIVE" /tmp/live.html
      - name: Server log on failure
        if: failure()
        run: cat /tmp/streamlive.log
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlive-core-log
          path: /tmp/streamlive.log
          if-no-files-found: ignore
      - name: Stop core
        if: always()
        run: test ! -f /tmp/streamlive.pid || kill "$(cat /tmp/streamlive.pid)" || true
