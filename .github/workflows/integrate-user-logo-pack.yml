name: integrate-user-logo-pack
on:
  push:
    paths:
      - "assets/logos/source-pack/**"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait until all pack fragments exist
        id: ready
        run: |
          count=$(find assets/logos/source-pack -maxdepth 1 -name 'part-*.b64' | wc -l)
          echo "count=$count"
          if [ "$count" -ne 8 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Extract exact user-provided logos
        if: steps.ready.outputs.ready == 'true'
        run: |
          cat assets/logos/source-pack/part-*.b64 | base64 -d > /tmp/user-logos.tar.gz
          tar -xzf /tmp/user-logos.tar.gz -C assets/logos
          rm -rf assets/logos/source-pack /tmp/user-logos.tar.gz
      - name: Commit extracted logos
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name "StreamLive Bot"
          git config user.email "streamlive-bot@users.noreply.github.com"
          git add assets/logos
          if git diff --cached --quiet; then
            echo "No logo changes."
            exit 0
          fi
          git commit -m "feat(logos): integrate exact user-provided logo pack"
          git push
