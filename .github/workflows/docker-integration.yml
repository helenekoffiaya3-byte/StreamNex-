name: StreamLive Docker validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d
      - name: Validate
        run: |
          set -eux
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/stream/channels >/tmp/channels.json && break
            sleep 2
          done
          grep -q '"count":149' /tmp/channels.json
          curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json
          grep -q '"database":false' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/catalogue >/tmp/catalogue.json
          grep -q '"multi-live"' /tmp/catalogue.json
          curl -fsS http://127.0.0.1:3000/api/live/channels >/tmp/live.json
          grep -q '"count":149' /tmp/live.json
          curl -fsS http://127.0.0.1:3000/api/channels/rti-1/programs >/tmp/programs.json
          grep -q '"programCount":14' /tmp/programs.json
          node -e "const d=require('/tmp/programs.json'); if(!d.success||!Array.isArray(d.occurrences)) process.exit(1); console.log('programme contract OK')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/data/streamlive.sqlite)" = "404"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
