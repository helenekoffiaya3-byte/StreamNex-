<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamLive — Chaîne</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script></head><body><header><a class="logo" href="/">STREAM<span>LIVE</span></a><a href="/live">LIVE</a></header><main id="channel"><p>Chargement…</p></main><script>const id=decodeURIComponent(location.pathname.split('/').pop());const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const [cr,sr,pr]=await Promise.all([fetch('/api/channels/'+encodeURIComponent(id)),fetch('/api/channels/'+encodeURIComponent(id)+'/source'),fetch('/api/channels/'+encodeURIComponent(id)+'/programs')]);const c=(await cr.json()).channel,s=(await sr.json()).source,p=await pr.json();document.title='StreamLive — '+c.name;document.querySelector('#channel').innerHTML='<section class="hero"><h1>'+esc(c.name)+'</h1><p>'+esc(c.group)+' · source '+esc(s.status)+'</p></section>'+(s.url&&c.playbackMode!=='external'?'<video id="video" controls playsinline autoplay style="width:100%;max-height:70vh;background:#000"></video>':'<div class="empty">'+(c.externalUrl?'Service externe — ouverture automatique.':'Aucune URL source configurée.')+'</div>')+'<section><h2>Programme</h2><div class="program-list">'+(p.programmes||[]).map(x=>'<article><strong>'+esc(x.title)+'</strong><span>'+esc(x.startTime)+' — '+esc(x.endTime)+'</span></article>').join('')+'</div></section>';if(s.url&&c.playbackMode!=='external'){const v=document.querySelector('#video');if(window.Hls&&Hls.isSupported()){const h=new Hls({capLevelToPlayerSize:true,maxBufferLength:10,liveSyncDuration:3});h.loadSource(s.url);h.attachMedia(v)}else{v.src=s.url}}}init().catch(e=>document.querySelector('#channel').textContent=e.message);</script></body></html>
