<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamLive — Chaîne</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script></head><body><header><a class="logo" href="/">STREAM<span>LIVE</span></a><nav><a href="/">Chaînes</a><a href="/live">LIVE</a></nav></header><main id="channel"><p>Chargement…</p></main><script>
const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let hls=null;
async function api(u){const r=await fetch(u,{headers:{Accept:'application/json'}});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Erreur API');return d;}
function play(url){const v=document.querySelector('#video');if(!v||!url)return;if(hls)hls.destroy();if(window.Hls&&Hls.isSupported()&&/\.m3u8(?:$|\?)/i.test(url)){hls=new Hls({enableWorker:true,lowLatencyMode:true,capLevelToPlayerSize:true,maxBufferLength:10});hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED',()=>v.play().catch(()=>{}));}else{v.src=url;v.play().catch(()=>{});}}
async function init(){const d=await api('/api/channels/'+encodeURIComponent(id));const p=await api('/api/channels/'+encodeURIComponent(id)+'/programs');const c=d.channel;document.title='StreamLive — '+c.name;const current=d.channel.current;document.querySelector('#channel').innerHTML=`<section class="hero"><h1>${esc(c.name)}</h1><p>${esc(c.group)} · source ${esc(c.sourceStatus)}</p><div class="player-wrap"><video id="video" controls playsinline ${c.sourceConfigured?'':'hidden'}></video><div class="empty" id="offline">${c.sourceConfigured?'':'Aucune URL source configurée.'}</div></div><p>${current?'🔴 '+esc(current.title):'Aucun programme en cours'}</p></section><section><h2>Programme TV</h2><div class="program-list">${(p.programmes||[]).map(x=>'<article><strong>'+esc(x.title)+'</strong><span>'+esc(x.startTime)+' — '+esc(x.endTime)+'</span></article>').join('')||'<p>Aucun programme configuré.</p>'}</div></section>`;if(c.sourceConfigured&&c.playbackMode!=='external')play((await api('/api/channels/'+encodeURIComponent(id)+'/source')).source.url);}
init().catch(e=>document.querySelector('#channel').textContent=e.message);
</script></body></html>
