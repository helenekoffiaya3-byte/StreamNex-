<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - STREAMNEX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] min-h-screen flex items-center justify-center p-4">

<div class="bg-[#151515] border border-white/20 rounded-[24px] w-full max-w-[650px] p-8">

  <div class="flex justify-center -mt-12 mb-2">
    <img src="logo.png" alt="STREAMNEX" class="h-[110px] object-contain">
  </div>

  <h1 class="text-5xl font-black text-white text-center tracking-tighter">STREAMNEX</h1>
  <h2 class="text-4xl font-black text-white text-center mt-1">Se connecter</h2>
  <p class="text-white/60 text-center mt-2">Content de vous revoir !</p>

  <div class="grid md:grid-cols-2 gap-4 mt-8">
    <div>
      <label class="text-sm text-white/80">Adresse email</label>
      <input type="email" placeholder="votre@email.com" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
    </div>
    <div>
      <label class="text-sm text-white/80">Mot de passe</label>
      <div class="relative">
        <input type="password" placeholder="••••••••" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]">
        <span class="absolute right-4 top-4 text-white/40">👁️</span>
      </div>
    </div>
  </div>

  <div class="flex justify-between items-center mt-4">
    <label class="flex items-center gap-2 text-sm text-white/80">
      <input type="checkbox" checked class="accent-[#22C55E] rounded"> Se souvenir de moi
    </label>
    <a href="#" class="text-[#22C55E] text-sm">Mot de passe oublié ?</a>
  </div>

  <a href="abonnement.html" class="block text-center bg-[#22C55E] text-white font-black text-xl py-4 rounded-xl mt-6 hover:bg-[#16a34a]">Se connecter</a>

  <p class="text-center text-white/70 mt-6">Pas encore de compte? <br><a href="inscription.html" class="text-[#22C55E] font-bold">S'inscrire</a></p>

</div>

</body>
</html>
