<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion - STREAMNEX</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0A0A0A] min-h-screen flex items-center justify-center p-4">
<div class="bg-[#151515] border border-white/20 rounded-[24px] w-full max-w-[560px] p-8">
  <div class="flex justify-center mb-3"><img src="logo.png" alt="STREAMNEX" class="h-[100px] object-contain"></div>
  <h1 class="text-4xl font-black text-white text-center">STREAMNEX</h1><h2 class="text-3xl font-black text-white text-center mt-2">Se connecter</h2><p class="text-white/60 text-center mt-2">Content de vous revoir !</p>
  <form id="login-form" class="mt-8 space-y-4">
    <div><label for="email" class="text-sm text-white/80">Adresse email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="votre@email.com" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <div><label for="password" class="text-sm text-white/80">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe" class="w-full mt-1 bg-[#0A0A0A] border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-[#22C55E]"></div>
    <p id="form-message" role="status" aria-live="polite" class="text-sm text-center text-white/70"></p>
    <button id="login-submit" type="submit" class="w-full bg-[#22C55E] text-black font-black text-xl py-4 rounded-xl mt-4 hover:bg-[#16a34a]">Se connecter</button>
    <p class="text-center text-white/70 mt-5">Pas encore de compte ? <a href="inscription.html" class="text-[#22C55E] font-bold">Créer un compte</a></p>
  </form>
</div>
<script type="module">
import { login, handleAuthCallback } from "https://esm.sh/@netlify/identity";
const message = document.getElementById("form-message");
const form = document.getElementById("login-form");
const submit = document.getElementById("login-submit");
const destination = new URLSearchParams(location.search).get("redirect") || "user.homepage.html";
try {
  const callback = await handleAuthCallback();
  if (callback?.user) window.location.replace(destination);
} catch (error) { message.textContent = "Le lien reçu par email n'a pas pu être validé."; }
form.addEventListener("submit", async event => {
  event.preventDefault(); submit.disabled = true; submit.textContent = "Connexion…"; message.textContent = "";
  try {
    await login(form.email.value.trim(), form.password.value);
    window.location.replace(destination);
  } catch (error) {
    message.textContent = error?.message || "Connexion impossible. Vérifiez votre email et votre mot de passe.";
  } finally { submit.disabled = false; submit.textContent = "Se connecter"; }
});
</script>
<script src="/compte/lang-ui.js"></script>
</body>
</html>
