<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLEO TV</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#08080a;color:white}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 60px;position:absolute;top:0;width:100%;z-index:10}
.logo{font-weight:800;font-size:24px;letter-spacing:2px}.logo span{color:#ff6a00}
.btn{padding:12px 22px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;border:none}
.btn-orange{background:#ff6a00;color:white}
.hero{min-height:100vh;display:flex;align-items:center;padding:100px 60px 40px;background:linear-gradient(90deg,#0a0a0a 45%,rgba(0,0,0,0) 100%),url('https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?q=80&w=2000');background-size:cover;background-position:center}
.hero-content{max-width:650px}
.hero h1{font-size:64px;line-height:1.05;font-weight:800;margin-bottom:24px}
.stats{display:flex;gap:40px;margin:30px 0}.stats b{display:block;font-size:28px;color:#ff6a00}
@media(max-width:768px){header{padding:16px;gap:12px;flex-wrap:wrap}.hero{padding:100px 20px 30px}.hero h1{font-size:38px}.stats{gap:20px}.btn{padding:10px 12px}}
</style>
</head>
<body>
<header>
<div class="logo">BLEO <span>TV</span></div>
<div id="auth-buttons">
<button onclick="netlifyIdentity.open('login')" class="btn" style="background:transparent;color:white;border:1px solid #ffffff30">Se connecter</button>
<button onclick="netlifyIdentity.open('signup')" class="btn btn-orange" style="margin-left:10px">Créer votre compte</button>
</div>
</header>
<section class="hero">
<div class="hero-content">
<h1>Le Cinéma <em style="color:#ff6a00;font-style:normal">Africain</em> Authentique</h1>
<p style="opacity:0.7;line-height:1.6;margin-bottom:20px">Des histoires qui vous ressemblent. Films, séries et live 24/7.</p>
<div class="stats">
<div><b>1,250+</b><span style="font-size:11px;opacity:0.6;letter-spacing:1px">FILMS</span></div>
<div><b>300</b><span style="font-size:11px;opacity:0.6;letter-spacing:1px">SÉRIES</span></div>
<div><b>24/7</b><span style="font-size:11px;opacity:0.6;letter-spacing:1px">LIVE</span></div>
</div>
<div style="margin-top:40px;padding:24px;background:#111;border-radius:12px;border:1px solid #ffffff14">
<h3>Créez votre compte pour accéder à tout le catalogue</h3>
<button onclick="netlifyIdentity.open('signup')" class="btn btn-orange" style="margin-top:16px">Créer votre compte Netlify</button>
</div>
</div>
</section>
<script>
netlifyIdentity.on('login', () => { window.location.href = '/app.html'; });
netlifyIdentity.on('signup', () => { window.location.href = '/app.html'; });
netlifyIdentity.init();
</script>
</body>
</html>
